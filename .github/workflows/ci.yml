name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, test, build
        run: npm run verify

  # The guardrail checker is deliberately taken from the BASE ref, not from the
  # checkout. On a `pull_request` event the checkout is the PR's merge ref, so
  # running `harness/src/cli/check-pr.mjs` from it would execute the *pull
  # request's own* copy of protected.mjs/pr-rules.mjs: a bot commit that rewrote
  # `PROTECTED_PATHS = []` would pass its own audit. The step below extracts
  # `harness/` from `origin/$BASE_REF` with `git archive` and runs that copy
  # against this repository instead — a pull request must not supply its own
  # judge. The checker only reads git objects (diff/show/ls-tree/merge-base), so
  # it needs the repository as its working directory but none of the PR's files.
  #
  # Known and NOT closable here: a pull request can also edit this workflow file
  # itself (keep the YAML valid, keep the job named `pr-rules`, replace the step
  # with `exit 0`) and the required check goes green. For a `pull_request` event
  # the workflow definition comes from the pull request, so no in-repository
  # check can prevent that; it is handled outside the repo by token permissions.
  # Do not "fix" it with `pull_request_target`.
  pr-rules:
    name: pr-rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No job-level `if:`, deliberately. A skipped job SATISFIES a required status
    # check (GitHub: a required check must be "successful, skipped, or neutral"),
    # so any condition that skips this job would silently make the guardrail
    # optional while still showing green. The event test lives in the step below,
    # which always reports a real conclusion. Never add an `if:` here, and never
    # add `paths:`/`paths-ignore:` filters to `on:`.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check guardrails
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "pr-rules: not a pull request event ($EVENT) — nothing to check"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          # Run the guardrail from the BASE branch, never the pull request's own copy:
          # a pull request must not be allowed to supply its own judge.
          rm -rf "$RUNNER_TEMP/base-harness"
          mkdir -p "$RUNNER_TEMP/base-harness"
          git archive "origin/$BASE_REF" harness | tar -x -C "$RUNNER_TEMP/base-harness"
          node "$RUNNER_TEMP/base-harness/harness/src/cli/check-pr.mjs" \
            --base "origin/$BASE_REF" --author "$PR_AUTHOR"

  agent:
    name: agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v6
      - name: Python tests
        run: uv run --frozen pytest -q
