[project]
name = "loop-agent"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "strands-agents>=1.0",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
